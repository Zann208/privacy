<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRIV Privacy Console</title>
<meta name="theme-color" content="#0a0b12">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0b12;color:#e9ecf6;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#boot{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#0a0b12;color:#66708c;letter-spacing:.08em;text-align:center;padding:24px}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0a0b12;visibility:hidden}
a{color:#a78bfa}
</style>
</head>
<body>
<div id="boot">LOADING PRIVACY CONSOLE…</div>
<iframe id="app" title="Privacy Technologies Study Console" src="./legacy.html?v=20260822openbook"></iframe>
<script>
(function(){
  var frame=document.getElementById('app');
  var boot=document.getElementById('boot');
  function inject(doc,src){return new Promise(function(resolve,reject){var s=doc.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=function(){reject(new Error('Failed to load '+src));};(doc.body||doc.documentElement).appendChild(s);});}
  function activateValidTab(win,doc){
    var saved='home';
    try{if(typeof win.LSget==='function')saved=win.LSget('privTab','home')||'home';else saved=win.localStorage.getItem('privTab')||'home';}catch(e){saved='home';}
    var target=doc.getElementById(saved);if(!target||!target.classList.contains('tab'))saved='home';
    try{if(typeof win.go==='function')win.go(saved,true);else{doc.querySelectorAll('section.tab').forEach(function(s){s.classList.toggle('on',s.id===saved);});doc.querySelectorAll('.tabbtn[data-tab]').forEach(function(b){b.classList.toggle('on',b.dataset.tab===saved);});}}
    catch(e){saved='home';doc.querySelectorAll('section.tab').forEach(function(s){s.classList.toggle('on',s.id==='home');});doc.querySelectorAll('.tabbtn[data-tab]').forEach(function(b){b.classList.toggle('on',b.dataset.tab==='home');});}
    if(!doc.querySelector('section.tab.on')){var home=doc.getElementById('home');if(home)home.classList.add('on');var hb=doc.querySelector('.tabbtn[data-tab="home"]');if(hb)hb.classList.add('on');}
  }
  frame.addEventListener('load',function(){
    var doc,win;try{win=frame.contentWindow;doc=frame.contentDocument||win.document;}catch(e){boot.innerHTML='Could not access the Privacy console document.<br><small>'+String(e)+'</small>';return;}
    inject(doc,'./topic3.js?v=20260822openbook')
      .then(function(){return inject(doc,'./midterm-static-tab.js?v=20260822openbook');})
      .then(function(){return inject(doc,'./course-code-privacy.js?v=20260825');})
      .then(function(){activateValidTab(win,doc);frame.style.visibility='visible';boot.style.display='none';})
      .catch(function(err){try{activateValidTab(win,doc);}catch(e){}frame.style.visibility='visible';boot.style.display='none';console.error(err);});
  });
})();
</script>
</body>
</html>
