name: Console source validation

on:
  push:
    paths:
      - 'index.html'
      - 'midterm-pack.html'
      - '*.js'
      - '.github/workflows/flatten-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the maintained entry pages
        run: |
          test -f index.html
          test -f midterm-pack.html
          test -f .nojekyll
          for f in *.js; do node --check "$f"; done
      - name: Verify Study Console v3 wiring and v2 rollback pages
        run: |
          for p in index midterm-pack; do
            test -f "$p.v2.html"
            grep -q 'study/shared/v3/boot.js' "$p.html"
            grep -q "data-v2=\"$p.v2.html\"" "$p.html"
            grep -q 'StudyConsole' "$p.html"
            if grep -q 'shared/v2/' "$p.html"; then echo "$p.html still loads v2"; exit 1; fi
          done
